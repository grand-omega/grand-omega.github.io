{% extends "base.html" %}

{% block title %}Tags | {{ config.title }}{% endblock title %}

{% block content %}
<div class="page-content">
    <h1>Tags</h1>
    <ul class="tags-list">
    {% for term in terms %}
        <li class="tags-list-item">
            <a href="{{ term.permalink }}">
                {{ term.name }}
                <span class="tag-count">({{ term.pages | length }})</span>
            </a>
        </li>
    {% endfor %}
    </ul>
</div>
{% endblock content %}
